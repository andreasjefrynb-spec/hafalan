<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>日本語 クラス</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#1e293b;--muted:#64748b;--red:#dc2626;--red2:#ef4444;--line:#e2e8f0;--shadow:0 10px 25px rgba(0,0,0,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:30px}button,input,select{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}.wrap{width:100%;max-width:600px;margin:auto;padding:0 14px}
.hero{color:#fff;background:linear-gradient(135deg,#991b1b 0%,#dc2626 100%);padding:20px 0 16px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;box-shadow:0 4px 20px rgba(220,38,38,.2)}.heroRow{display:flex;align-items:center;justify-content:space-between}.brand h1{margin:0;font-size:24px;letter-spacing:.3px}.heroBadge{background:rgba(255,255,255,.18);padding:8px 12px;border-radius:12px;text-align:center}.heroBadge b{display:block;font-size:16px}.heroBadge span{font-size:10px;opacity:.9}
main{padding:16px 14px}.view{display:none}.view.active{display:block}.titleRow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.titleRow h2{margin:0;font-size:20px}.back{border:0;background:#fff;color:var(--red);font-weight:750;padding:8px 12px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:750;padding:10px 14px;border-radius:10px;cursor:pointer;box-shadow:0 4px 12px rgba(220,38,38,.2)}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.modeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}.modeCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 14px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);text-align:center}.modeCard:active{transform:scale(.97)}.modeIcon{font-size:32px;margin-bottom:6px}.modeCard h3{margin:4px 0 2px;font-size:17px}.modeCard p{margin:0;color:var(--muted);font-size:12px}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none;font-size:15px;margin-bottom:12px}.search:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.15)}.tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.table{width:100%;border-collapse:collapse;min-width:400px}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.jp{font-size:20px;font-weight:900}.romaji{color:var(--red);font-size:13px}.furigana{font-size:11px;color:var(--red);font-weight:800;min-height:14px}.empty{text-align:center;padding:30px;color:var(--muted)}
.kanjiGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kanjiCard{text-align:center;padding:14px}.kanji{font-size:42px;font-weight:900;line-height:1.1}.kanjiReading{color:var(--red);font-weight:800;font-size:13px;margin-top:2px}.kanjiMeaning{margin-top:4px;font-weight:750;font-size:13px}
.flashBox{min-height:260px;display:flex;align-items:center;justify-content:center}.flashCard{width:100%;min-height:240px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer}.flashCard .big{font-size:44px;font-weight:900}.flashCard .answerMeaning{font-size:24px;font-weight:850}.flashHint{color:var(--muted);font-size:12px;margin-bottom:8px}.controls{display:flex;justify-content:center;gap:8px;margin-top:14px}.progressText{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.quizCard{text-align:center}.quizWord{font-size:42px;font-weight:900;margin:10px 0}.choices{display:grid;grid-template-columns:1fr;gap:10px;margin:16px 0}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-weight:750;font-size:15px;cursor:pointer;text-align:center}.choice.correct{background:#dcfce7;border-color:#86efac;color:#166534}.choice.wrong{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.feedback{min-height:22px;font-weight:800;margin-bottom:10px}
footer{padding:16px;text-align:center;color:var(--muted);font-size:11px}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<header class="hero"><div class="wrap heroRow"><div class="brand"><h1>日本語 クラス</h1></div><div class="heroBadge"><b id="headerCount">0</b><span>kosakata</span></div></div></header>
<main class="wrap">
  <section id="lessonView" class="view active">
    <div style="margin-bottom: 14px;"><h2 style="margin:0;font-size:20px;">Menu Belajar</h2><p style="margin:4px 0 0;color:var(--muted);font-size:13px;">Pilih mode latihan di bawah ini.</p></div>
    <div class="modeGrid">
      <div class="modeCard" onclick="openMode('vocab')"><div class="modeIcon">📚</div><h3>Kosakata</h3><p>Daftar lengkap</p></div>
      <div class="modeCard" onclick="openMode('kanji')"><div class="modeIcon">漢</div><h3>Kanji</h3><p>Daftar kanji</p></div>
      <div class="modeCard" onclick="openMode('flash')"><div class="modeIcon">🃏</div><h3>Flashcard</h3><p>Kartu hafalan</p></div>
      <div class="modeCard" onclick="openMode('quiz')"><div class="modeIcon">🧠</div><h3>Quiz</h3><p>Uji pilihan ganda</p></div>
    </div>
  </section>

  <section id="vocabView" class="view">
    <div class="titleRow"><button class="back" onclick="showLesson()">← Menu</button><h2 style="font-size:18px;margin:0">📚 Kosakata</h2></div>
    <div class="card" style="padding:12px;"><input id="search" class="search" placeholder="Cari kata..." oninput="renderVocab()"><div class="tableWrap"><table class="table"><thead><tr><th>Jepang</th><th>Furigana</th><th>Romaji</th><th>Arti</th></tr></thead><tbody id="vocabBody"></tbody></table></div></div>
  </section>

  <section id="kanjiView" class="view">
    <div class="titleRow"><button class="back" onclick="showLesson()">← Menu</button><h2 style="font-size:18px;margin:0">漢字 Kanji</h2></div>
    <div class="card" style="padding:12px;"><input id="kanjiSearch" class="search" placeholder="Cari kanji..." oninput="renderKanji()"><div id="kanjiGrid" class="kanjiGrid"></div></div>
  </section>

  <section id="flashView" class="view">
    <div class="titleRow"><button class="back" onclick="showLesson()">← Menu</button><h2 style="font-size:18px;margin:0">🃏 Flashcard</h2></div>
    <div class="card"><div class="flashBox"><div id="flashCard" class="flashCard" onclick="flipCard()"></div></div><div class="controls"><button class="secondary" onclick="prevCard()">← Prev</button><button class="primary" onclick="masterCard()">✓ Hafal</button><button class="secondary" onclick="nextCard()">Next →</button></div><div id="flashProgress" class="progressText"></div></div>
  </section>

  <section id="quizView" class="view">
    <div class="titleRow"><button class="back" onclick="showLesson()">← Menu</button><h2 style="font-size:18px;margin:0">🧠 Quiz</h2></div>
    <div class="card quizCard"><div style="color:var(--muted);font-size:12px">Pertanyaan <span id="qNum">1</span></div><div id="qWord" class="quizWord">—</div><div id="qFuri" class="furigana" style="font-size:14px;margin-bottom:10px"></div><div id="choices" class="choices"></div><div id="quizFeedback" class="feedback"></div><button class="primary" style="width:100%" onclick="newQuiz()">Soal Berikutnya →</button></div>
  </section>
</main>
<footer>日本語 クラス</footer>

<script src="kotoba.js"></script>

<script>
(function(){
'use strict';
const KEY='nihongoClassData_v8';

let vocab = (window.MASTER_KOTOBA || []).map((x,i)=>({
    id:'v'+i, jp:x[0], furigana:x[1], romaji:x[2], meaning:x[3], example:'', mastered:false
}));

let current=0,flipped=false,quizIndex=0,quizLocked=false;
document.getElementById('headerCount').textContent=vocab.length;

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function showOnly(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}

window.showLesson=function(){showOnly('lessonView');};
window.openMode=function(mode){showOnly(mode+'View');if(mode==='vocab')renderVocab();if(mode==='kanji')renderKanji();if(mode==='flash'){current=0;flipped=false;loadCard()}if(mode==='quiz')newQuiz();};

function renderVocab(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const rows=vocab.filter(x=>(x.jp+' '+x.furigana+' '+x.romaji+' '+x.meaning).toLowerCase().includes(q));
  document.getElementById('vocabBody').innerHTML=rows.length?rows.map(x=>`<tr><td><span class="jp">${esc(x.jp)}</span></td><td><span class="furigana">${esc(x.furigana||'—')}</span></td><td class="romaji">${esc(x.romaji||'—')}</td><td>${esc(x.meaning)}</td></tr>`).join(''): '<tr><td colspan="4" class="empty">Tidak ada hasil.</td></tr>';
}

function uniqueKanjiRows(){const seen=new Set(),out=[];vocab.forEach(x=>{const raw=String(x.jp||'').trim();if(!/[一-龯々]/.test(raw))return;const key=raw+'|'+(x.furigana||'');if(!seen.has(key)){seen.add(key);out.push(x)}});return out;}
function renderKanji(){
  const q=(document.getElementById('kanjiSearch').value||'').toLowerCase();
  const rows=uniqueKanjiRows().filter(x=>(x.jp+' '+x.furigana+' '+x.meaning).toLowerCase().includes(q));
  document.getElementById('kanjiGrid').innerHTML=rows.length?rows.map(x=>`<article class="card kanjiCard"><div class="kanji">${esc(x.jp)}</div><div class="kanjiReading">${esc(x.furigana||'—')}</div><div class="kanjiMeaning">${esc(x.meaning)}</div></article>`).join(''):'<div class="card empty" style="grid-column:span 2">Tidak ada Kanji.</div>';
}

function cardList(){return vocab.filter(x=>x.jp&&x.meaning)}
window.flipCard=function(){const list=cardList();if(!list.length)return;flipped=!flipped;renderFlash(list[current]);};
function loadCard(){const list=cardList();const box=document.getElementById('flashCard');if(!list.length){box.innerHTML='<div><div class="big">📭</div><p class="muted">Kosong</p></div>';document.getElementById('flashProgress').textContent='';return}if(current>=list.length)current=0;if(current<0)current=list.length-1;renderFlash(list[current]);}
function renderFlash(listItem){
  const x=listItem;
  document.getElementById('flashCard').innerHTML=flipped?`<div><div class="flashHint">Arti</div><div class="answerMeaning">${esc(x.meaning)}</div></div>`:`<div><div class="flashHint">Ketuk untuk melihat arti</div><div class="big">${esc(x.jp)}</div><div class="furigana" style="margin-top:6px">${esc(x.furigana||'')}</div></div>`;
  document.getElementById('flashProgress').textContent=(current+1)+' / '+list.length;
}
window.nextCard=function(){const list=cardList();if(!list.length)return;current=(current+1)%list.length;flipped=false;loadCard();};
window.prevCard=function(){const list=cardList();if(!list.length)return;current=(current-1+list.length)%list.length;flipped=false;loadCard();};
window.masterCard=function(){nextCard();};

function newQuiz(){
  const list=cardList();quizLocked=false;document.getElementById('quizFeedback').textContent='';
  if(!list.length){document.getElementById('qWord').textContent='—';document.getElementById('choices').innerHTML='';return}
  quizIndex=Math.floor(Math.random()*list.length);const x=list[quizIndex];
  document.getElementById('qNum').textContent='?';document.getElementById('qWord').textContent=x.jp;document.getElementById('qFuri').textContent=x.furigana||'';
  const others=list.filter((_,i)=>i!==quizIndex).sort(()=>Math.random()-.5).slice(0,3);
  const choices=[x,...others].sort(()=>Math.random()-.5);
  document.getElementById('choices').innerHTML=choices.map(c=>`<button class="choice" onclick="answerQuiz('${esc(c.id)}',this)">${esc(c.meaning)}</button>`).join('');
}
window.newQuiz=newQuiz;
window.answerQuiz=function(id,btn){
  if(quizLocked)return;quizLocked=true;const list=cardList(),x=list[quizIndex];
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  if(String(id)===String(x.id)){btn.classList.add('correct');document.getElementById('quizFeedback').textContent='✅ Benar!';}
  else{btn.classList.add('wrong');document.getElementById('quizFeedback').textContent='❌ Salah. Jawaban: '+x.meaning;document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===x.meaning)b.classList.add('correct')})}
};

showLesson();
})();
</script>
</body>
</html>
